pipelineName: postgresql-currency-tax-type
source:
  type: postgresql
  hostEnv: PSQL_HOSTNAME
  databaseEnv: PSQL_DB
  usernameEnv: PSQL_USERNAME
  passwordEnv: PSQL_PASSWORD
tables:
  - schema: public
    name: CURRENCY
    query: SELECT * FROM public."CURRENCY"
    schemaRef: ../schemas/postgresql-currency.schema.yaml
    outputName: currency
  - schema: public
    name: TAX_TYPE
    query: SELECT * FROM public."TAX_TYPE"
    schemaRef: ../schemas/postgresql-tax_type.schema.yaml
    outputName: tax_type
output:
  s3Prefix: runs
runtime:
  tablesPerPod: 10
  profile: medium

pipelineName: wf-alca-load
source:
  type: oracle
  databaseUrl: jdbc:oracle:thin:@D008TT01-RTPE.TEST.KB.CZ:1521:D008TT01
  usernameEnv: ORACLE_USERNAME
  passwordEnv: PSQL_PASSWORD
tables:
  - schema: INFORMATICA_UAT
    name: KB_MC_INFORMATICA_ACCOUNTS_OUT
    query: SELECT BATCH_CODE, BANK_CODE, BANKING_CORE, ACCOUNT_NUMBER, APPLICATION_TYPE, ACCOUNT_TYPE, ACCOUNT_STATUS, CURRENT_BALANCE, ACCOUNT_CURRENCY, ACCOUNT_OWNER, ACCOUNT_NAME, ACCOUNT_CREATED, BRANCH, ACCOUNTING_CIRCLE, CORE_ACCOUNT_NUMBER, PART_KEY, STATEMENT_DESTINATION, STATEMENT_TYPE, STATEMENT_FREQUENCY, STATEMENT_DATE, STATEMENT_ADDRESS_LINE_1, STATEMENT_ADDRESS_LINE_2, STATEMENT_ADDRESS_LINE_3, STATEMENT_ZIP_CODE, STATEMENT_COUNTRY, BUSINESS_PRODUCT_ID, CLOSURE_DATE, POSTING_RESTRICTIONS, LOAN_BALANCE, CARD_BALANCE, CREDIT_CARD_LIMIT, AVAILABLE_BALANCE, DEBIT_HOLDS, CREDIT_HOLDS, OVER_DRAFT_LIMIT_1, OVER_DRAFT_LIMIT_2 FROM KB_MC_INFORMATICA_ACCOUNTS_OUT
    schemaRef: ../schemas/KB_MC_INFORMATICA_ACCOUNTS_OUT.schema.yaml
    incremental:
      enabled: true
      column: BATCH_CODE
      type: number
      lowerBoundParam: EXTRACT_FROM
      upperBoundParam: EXTRACT_TO
      lowerInclusive: true
      upperExclusive: true
output:
  s3Prefix: runs
runtime:
  tablesPerPod: 10
  profile: large

